<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- SEO & Metadata -->
  <title>untuk mega bandung</title>
  <meta name="description" content="Professional Portfolio of Muhamad Syauqal Afwika Rahman - Tax & IT Advisor" />
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/id/2/2d/Undip.png" type="image/x-icon" />

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="SYAUQAL PORTOFOLIO" />
  <meta property="og:description" content="Professional Portfolio - Tax Accounting & IT Financial Advisor" />
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1oNZUUg22zKaAhmSYu0KOC-itJtuT6VAF&sz=w1000" />
  <meta property="og:url" content="https://qal.vercel.app" />
  <meta property="og:type" content="website" />

  <!-- PWA & Mobile Web App Settings -->
  <meta name="theme-color" content="#efeef6" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* RESET & CORE SETUP */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic Height untuk browser mobile modern */
      overflow: hidden; /* Mencegah scroll pada body luar */
      background-color: #efeef6;
      overscroll-behavior-y: none; /* Mencegah pull-to-refresh di Chrome mobile */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* LOADING SCREEN */
    #loader-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #efeef6;
      z-index: 1;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #ff4d6d; /* Warna disesuaikan, bisa diganti ke warna tema */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loader-container p {
      color: #555;
      font-size: 14px;
      font-weight: 500;
    }

    /* IFRAME CONTAINER */
    .iframe-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      -webkit-overflow-scrolling: touch; /* Smooth scroll di iOS */
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
      background-color: transparent;
    }

    /* IN-APP BROWSER HINT (IG/FB) */
    .ig-overlay-hint {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      pointer-events: none;
      backdrop-filter: blur(5px);
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      animation: slideUpFadeOut 6s forwards;
      animation-delay: 1s;
    }

    @keyframes slideUpFadeOut {
      0% { opacity: 0; bottom: 20px; }
      10% { opacity: 1; bottom: 40px; }
      80% { opacity: 1; bottom: 40px; }
      100% { opacity: 0; bottom: 50px; visibility: hidden; }
    }
  </style>
</head>
<body>
  
  <!-- HINT UNTUK PENGGUNA IG/FB -->
  <div id="ig-hint" class="ig-overlay-hint">
    Tampilan sempit? Klik titik 3 di atas ↗ & Buka di Browser
  </div>

  <!-- LOADING ANIMATION -->
  <div id="loader-container">
    <div class="spinner"></div>
    <p>Menyiapkan Halaman...</p>
  </div>

  <!-- IFRAME WEB APP -->
  <div class="iframe-container">
    <iframe
      id="main-frame"
      src="https://script.google.com/macros/s/AKfycbwwGSeESZxON5agbechP5JKBWH4Pu2qpJtHqfuK0l2ykFj1Wj666s6x72O2XAkHxot4yA/exec"
      allow="fullscreen; clipboard-read; clipboard-write; autoplay; camera; microphone"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation allow-downloads"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allowtransparency="true"
      onload="hideLoader()"> <!-- Event penting untuk menyembunyikan loader -->
    </iframe>
  </div>

  <script>
    // 1. SCRIPT DETEKSI IN-APP BROWSER (INSTAGRAM / FACEBOOK)
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isInstagram = (ua.indexOf('Instagram') > -1) || (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);

    if (isInstagram) {
      document.getElementById('ig-hint').style.display = 'block';
    }

    // 2. FUNGSI HIDE LOADER SAAT IFRAME SELESAI DIMUAT
    function hideLoader() {
      var loader = document.getElementById('loader-container');
      loader.style.opacity = '0';
      setTimeout(function() {
        loader.style.display = 'none';
      }, 500); // Menunggu transisi CSS selesai
    }

    // 3. FALLBACK TIMEOUT
    // Jika koneksi lambat dan iframe gagal load event-nya dalam 8 detik, hilangkan loader secara paksa
    setTimeout(function() {
      var loader = document.getElementById('loader-container');
      if (loader.style.display !== 'none') {
        hideLoader();
      }
    }, 8000);
  </script>
</body>
</html>
